[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TFENN"
version = "0.1.0"
description = "Tensor basis neural networks for benzene pair force and moment prediction"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["TFENN*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
